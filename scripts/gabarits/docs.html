<title>inventaire-vba · documentation</title>
<meta name="description" content="Documentation d'inventaire-vba : outil libre et hors ligne qui inventorie les macros VBA d'un parc Office et signale ce qui casse avec Office 64 bits, les signatures V3, le nouvel Outlook et la fin de VBScript.">
<style>
/* Mise en page : une planche d'ingénieur. Bandeaux pleine largeur, contenu sur une grille de 16 px,
   cartouche et cotes comme vocabulaire ; une seule couleur de signal (vert marche) : la bulle DEV-607. */
@font-face{font-family:Archivo;src:url(__ARCHIVO__) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:'Martian Mono';src:url(__MARTIAN__) format('woff2');font-weight:100 800;font-stretch:75% 112.5%;font-display:swap}
@font-face{font-family:Atkinson;src:url(__ATKINSON__) format('woff2');font-weight:200 800;font-display:swap}
:root{
  --fond:#D4D7DA; --papier:#F3F4F5; --encre:#1B1E21; --secondaire:#5C636A; --filet:#1B1E21; --carter:#9AA0A6;
  --trame:rgba(27,30,33,.075); --signal:#2BB673; --sur-signal:#1B1E21; --inverse-fond:#1B1E21; --inverse-encre:#F3F4F5;
  --f-titre:Archivo,'Arial Narrow',sans-serif; --f-data:'Martian Mono',ui-monospace,Menlo,monospace; --f-texte:Atkinson,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#1B1E21; --papier:#2A2F34; --encre:#F3F4F5; --secondaire:#AEB4BA; --filet:#C9CED3; --carter:#4A5158;
  --trame:rgba(255,255,255,.045); --inverse-fond:#F3F4F5; --inverse-encre:#1B1E21; color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#1B1E21; --papier:#2A2F34; --encre:#F3F4F5; --secondaire:#AEB4BA; --filet:#C9CED3; --carter:#4A5158;
  --trame:rgba(255,255,255,.045); --inverse-fond:#F3F4F5; --inverse-encre:#1B1E21; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:17px/1.55 var(--f-texte);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--trame) 1px,transparent 1px),linear-gradient(90deg,var(--trame) 1px,transparent 1px);background-size:16px 16px}
.bande{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.int{max-width:1120px;margin:0 auto}
.titre{font-family:var(--f-titre);font-weight:800;font-stretch:62%;text-transform:uppercase;line-height:.94;letter-spacing:-.005em;text-wrap:balance;margin:0}
.data{font-family:var(--f-data);font-stretch:87.5%;font-weight:500;text-transform:uppercase;letter-spacing:.07em;font-variant-numeric:tabular-nums}
p{margin:0;max-width:62ch}
a{color:inherit}
code{font-family:var(--f-data);font-stretch:87.5%;font-size:.86em}
:focus-visible{outline:2px solid var(--encre);outline-offset:3px}

/* En-tête */
.entete{padding-block:20px;border-bottom:1.5px solid var(--filet)}
.entete .int{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.marque{display:flex;align-items:flex-end;gap:10px;text-decoration:none}
.marque .titre{font-size:30px;line-height:.78}
.entete nav{display:flex;gap:20px;flex-wrap:wrap;font-size:11px}
.entete nav a{text-decoration:none}
.entete nav a:hover{text-decoration:underline}

/* Ouverture */
.ouverture{padding-block:56px 64px}
.ouverture .int{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:start}
.reperes{display:flex;gap:16px;align-items:center;margin-bottom:28px}
.reperes .data{font-size:11px;line-height:1.7;color:var(--secondaire)}
.ouverture h1{font-size:clamp(64px,10vw,124px)}
.ouverture .acc{font-size:clamp(19px,2.1vw,23px);line-height:1.4;margin:28px 0 32px;font-weight:500}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border:1.5px solid var(--filet);text-decoration:none;font:600 15px var(--f-texte);cursor:pointer;background:none;color:inherit}
.btn.plein{background:var(--inverse-fond);color:var(--inverse-encre);border-color:var(--inverse-fond)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--filet)}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid var(--filet);border-bottom:1.5px solid var(--filet);margin-top:40px}
.specs>div{padding:12px 0 12px 12px;min-width:0}
.specs>div:first-child{padding-left:0}
.specs>div+div{border-left:1px solid var(--filet)}
.specs .titre{font-size:40px}
.specs .data{font-size:9.5px;margin-top:6px;color:var(--secondaire)}
.planche-doc{position:relative;padding:0 0 36px 30px}
.planche-doc img{display:block;width:100%;height:auto;border:1.5px solid var(--filet)}
.cote{position:absolute;font-size:10px}
.cote.h{left:30px;right:0;bottom:6px;height:16px;border-left:1px solid var(--filet);border-right:1px solid var(--filet)}
.cote.h::before{content:"";position:absolute;left:0;right:0;top:8px;border-top:1px solid var(--filet)}
.cote.v{left:4px;top:0;bottom:36px;width:16px;border-top:1px solid var(--filet);border-bottom:1px solid var(--filet)}
.cote.v::before{content:"";position:absolute;top:0;bottom:0;left:8px;border-left:1px solid var(--filet)}
.cote span{position:absolute;background:var(--fond);padding:0 6px;white-space:nowrap}
.cote.h span{left:50%;top:1px;transform:translateX(-50%)}
.cote.v span{top:50%;left:8px;transform:translate(-50%,-50%) rotate(-90deg)}
.legende-doc{font-size:10px;color:var(--secondaire);margin-top:10px}

/* Sections */
section.bloc{padding-block:64px;border-top:1.5px solid var(--filet)}
.tete-bloc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:32px;align-items:end;margin-bottom:40px}
.tete-bloc h2{font-size:clamp(40px,5.4vw,64px)}
.tete-bloc p{color:var(--secondaire)}
.folio{display:inline-block;font-size:10px;border:1.5px solid var(--filet);padding:3px 7px;margin-bottom:14px}

/* Échéancier de support */
.echeancier{background:var(--papier);border:1.5px solid var(--filet);overflow-x:auto}
.echeancier table{width:100%;border-collapse:collapse;min-width:620px}
.echeancier th,.echeancier td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--carter);vertical-align:top}
.echeancier th{font:500 10px var(--f-data);font-stretch:87.5%;letter-spacing:.07em;text-transform:uppercase;color:var(--secondaire);border-bottom:1.5px solid var(--filet)}
.echeancier tr:last-child td{border-bottom:0}
.echeancier .v{font-family:var(--f-titre);font-weight:800;font-stretch:62%;font-size:30px;line-height:1}
.etat{display:inline-block;font:600 10px var(--f-data);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--filet)}
.etat.hors{background:var(--inverse-fond);color:var(--inverse-encre);border-color:var(--inverse-fond)}
.etat.fin{border-width:2.5px}
.etat.lts{border-style:solid}
.etat.actif{border-style:dashed}
.note{font-size:13px;color:var(--secondaire);margin-top:14px}

/* Déroulé */
.etapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid var(--filet)}
.etape{padding:20px 20px 24px 0;min-width:0}
.etape+.etape{border-left:1px solid var(--filet);padding-left:20px}
.etape .n{font-family:var(--f-titre);font-weight:800;font-stretch:62%;font-size:56px;line-height:1}
.etape h3{font:700 18px/1.3 var(--f-texte);margin:12px 0 8px}
.etape p{font-size:15px;color:var(--secondaire)}
.cmd{display:flex;margin-top:28px;border:1.5px solid var(--filet);background:var(--inverse-fond);color:var(--inverse-encre);max-width:100%}
.cmd code{flex:1;min-width:0;padding:16px 18px;font-size:15px;overflow-x:auto;white-space:nowrap}
.cmd button{border:0;border-left:1.5px solid var(--inverse-encre);background:none;color:inherit;padding:0 18px;font:600 11px var(--f-data);font-stretch:87.5%;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}

/* Axes */
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0;border-top:1.5px solid var(--filet);border-left:1.5px solid var(--filet)}
.axe{padding:22px 22px 26px;border-right:1.5px solid var(--filet);border-bottom:1.5px solid var(--filet);background:var(--papier);min-width:0}
.axe .data{font-size:10px;color:var(--secondaire)}
.axe h3{font:800 26px/1 var(--f-titre);font-stretch:62%;text-transform:uppercase;margin:10px 0 12px}
.axe ul{margin:0;padding:0;list-style:none;font-size:14.5px;display:grid;gap:6px}
.axe li{padding-left:16px;position:relative}
.axe li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:1.5px;background:var(--encre)}

/* Exemple */
.pages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.pages figure{margin:0;min-width:0}
.pages img{display:block;width:100%;height:auto;border:1.5px solid var(--filet)}
.pages figcaption{font-size:10px;margin-top:8px;color:var(--secondaire)}
.chiffres-ex{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px;align-items:center}

/* Tarifs */
.tarifs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--filet);background:var(--papier)}
.formule{padding:26px 24px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.formule+.formule{border-left:1.5px solid var(--filet)}
.formule .nom{font-size:11px}
.formule .prix{font-family:var(--f-titre);font-weight:800;font-stretch:62%;font-size:64px;line-height:.9}
.formule .prix small{font:500 12px var(--f-data);font-stretch:87.5%;letter-spacing:.05em;margin-left:4px}
.formule .pour{font-size:15px;color:var(--secondaire);min-height:3.1em}
.formule dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px;border-top:1px solid var(--carter);border-bottom:1px solid var(--carter);padding:10px 0}
.formule dt{font:500 10px/1.9 var(--f-data);font-stretch:87.5%;letter-spacing:.06em;text-transform:uppercase;color:var(--secondaire)}
.formule dd{margin:0;text-align:right;font-weight:600}
.formule ul{margin:0;padding:0;list-style:none;font-size:14.5px;display:grid;gap:7px;flex:1}
.formule li{padding-left:20px;position:relative}
.formule li::before{content:"";position:absolute;left:0;top:.55em;width:9px;height:5px;border-left:1.5px solid var(--encre);border-bottom:1.5px solid var(--encre);transform:rotate(-45deg)}
.formule li.plus{font-weight:600}
.formule li.plus::before{display:none}
.formule .btn{justify-content:center}
.conditions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px;font-size:14px}
.conditions>div{min-width:0}
.conditions h3{font:500 10px var(--f-data);font-stretch:87.5%;letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px}

/* Confidentialité */
.secret{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.flux{background:var(--papier);border:1.5px solid var(--filet);padding:22px;font-size:14px;align-self:start}
.flux svg{display:block;width:100%;height:auto}
.liste-garanties{display:grid;gap:16px;margin:0;padding:0;list-style:none}
.liste-garanties li{border-top:1px solid var(--filet);padding-top:12px}
.liste-garanties b{display:block;font-size:17px;margin-bottom:2px}

/* FAQ */
.faq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.faq details{border-top:1px solid var(--filet);padding:16px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:16.5px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";font:500 18px var(--f-data)}
.faq details[open] summary::after{content:"−"}
.faq summary::-webkit-details-marker{display:none}
.faq details p{margin-top:10px;font-size:15px;color:var(--secondaire)}

/* Pied */
.pied{padding-block:40px 56px;border-top:1.5px solid var(--filet)}
.pied .int{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;align-items:flex-end}
.cartouche{border:1.5px solid var(--filet);background:var(--papier);display:grid;grid-template-columns:2fr 1fr 1fr;min-width:0;max-width:100%}
.cartouche>div{padding:6px 10px 8px;min-width:0}
.cartouche>div+div{border-left:1px solid var(--filet)}
.cartouche .k{font-size:8.5px;color:var(--secondaire)}
.cartouche .v{font-size:12px;margin-top:3px;white-space:nowrap}
.mentions{font-size:12.5px;color:var(--secondaire);max-width:60ch;display:grid;gap:6px}
.mentions a,.cgv-lien a{color:inherit;text-underline-offset:3px}
.cgv-lien{margin:24px 0 0;font-size:14px;max-width:70ch}

@media (max-width:900px){
  .ouverture .int,.tete-bloc,.secret{grid-template-columns:1fr}
  .planche-doc{max-width:460px}
  .etapes{grid-template-columns:1fr 1fr}
  .etape:nth-child(3){border-left:0;padding-left:0}
  .etape:nth-child(n+3){border-top:1px solid var(--filet)}
  .tarifs{grid-template-columns:1fr}
  .formule+.formule{border-left:0;border-top:1.5px solid var(--filet)}
  .formule .pour{min-height:0}
  .pages{grid-template-columns:1fr 1fr}
  .conditions,.faq{grid-template-columns:1fr}
}
@media (max-width:520px){
  .specs{grid-template-columns:1fr 1fr}
  .specs>div:nth-child(3){border-left:0;padding-left:0}
  .specs>div:nth-child(n+3){border-top:1px solid var(--filet)}
  .etapes{grid-template-columns:1fr}
  .etape+.etape{border-left:0;padding-left:0;border-top:1px solid var(--filet)}
  .entete nav{display:none}
  .cartouche{grid-template-columns:1fr 1fr}
  .cartouche>div:first-child{grid-column:1/-1}
  .cartouche>div:nth-child(2){border-left:0;border-top:1px solid var(--filet)}
  .cartouche>div:nth-child(3){border-top:1px solid var(--filet)}
}

/* Propre à DEV-607 */
.tarifs.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
.groupe-tarifs+.groupe-tarifs{margin-top:40px}
.groupe-tarifs>h3{font:500 11px var(--f-data);font-stretch:87.5%;letter-spacing:.07em;text-transform:uppercase;margin:0 0 12px}
.formule .prix.zero{font-size:64px}
.echeancier td.n{font-family:var(--f-titre);font-weight:800;font-stretch:62%;font-size:30px;line-height:1;text-align:right;white-space:nowrap}
.echeancier th.n{text-align:right}
.echeancier td b{display:block;font-size:16px;margin-bottom:2px}
.echeancier td.q{white-space:nowrap;font:600 11px/1.8 var(--f-data);font-stretch:87.5%;letter-spacing:.05em;text-transform:uppercase}
.vue-ecran{border:1.5px solid var(--filet);display:block;width:100%;height:auto}
.duo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.formats{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.formats span{font:500 11px var(--f-data);font-stretch:87.5%;letter-spacing:.05em;padding:4px 7px;border:1px solid var(--filet);background:var(--papier)}
@media (max-width:900px){.tarifs.deux{grid-template-columns:1fr}.duo{grid-template-columns:1fr}}
</style>
<style>
.doc{padding-block:48px 64px}
.doc .int{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px}
.doc .int>*{min-width:0}
.doc nav{position:sticky;top:16px;align-self:start;display:grid;gap:8px;font-size:11px}
.doc nav a{text-decoration:none}.doc nav a:hover{text-decoration:underline}
.doc h1{font-size:clamp(48px,7vw,88px);margin-bottom:20px}
.doc h2{font:800 34px/1 var(--f-titre);font-stretch:62%;text-transform:uppercase;margin:48px 0 14px;padding-top:18px;border-top:1.5px solid var(--filet)}
.doc p,.doc li{max-width:72ch}
.doc p+p{margin-top:12px}
.doc ul,.doc ol{padding-left:20px;display:grid;gap:6px}
.doc pre{background:var(--inverse-fond);color:var(--inverse-encre);padding:16px 18px;overflow-x:auto;border:1.5px solid var(--filet);font:14px/1.6 var(--f-data);font-stretch:87.5%}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--papier);border:1.5px solid var(--filet)}
.doc th,.doc td{padding:9px 12px;border-bottom:1px solid var(--carter);text-align:left;vertical-align:top}
.doc th{font:500 10px var(--f-data);font-stretch:87.5%;letter-spacing:.07em;text-transform:uppercase;color:var(--secondaire);border-bottom:1.5px solid var(--filet)}
.doc .tab{overflow-x:auto}
.doc figure{margin:20px 0}.doc figure img{width:100%;height:auto;border:1.5px solid var(--filet);display:block}
@media (max-width:900px){.doc .int{grid-template-columns:1fr}.doc nav{position:static;grid-auto-flow:column;overflow-x:auto;gap:16px}}
</style>
